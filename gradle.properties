org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Kotlin support is built into AGP 9 (kotlin-gradle-plugin 2.2.10).
android.builtInKotlin=true
# KSP 2.2.10 still registers its generated sources through the kotlin.sourceSets DSL.
# AGP 9 rejects that by default; the escape hatch keeps KSP working until KSP speaks
# the android.sourceSets DSL natively.
android.disallowKotlinSourceSets=false
android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
